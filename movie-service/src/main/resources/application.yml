spring:
  application:
    name: movie-service

  datasource:
    url: jdbc:postgresql://localhost:5432/movie-service
    username: postgres
    password: system
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
server:
  port: 8083

logging:
  level:
    root: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %M - %msg%n"
